name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      verify_version:
        description:
          "Published Atlas version to verify from npm without publishing. Leave empty for release
          rehearsal."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do not treat this as the mutation-safety lock. The publisher reloads GitHub
  # state after required checks and re-evaluates the original target SHA.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rehearsal:
    name: Release Rehearsal
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.verify_version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate governance
        run: pnpm governance:check

      - name: Run isolated release rehearsal
        run: pnpm release:rehearse

      - name: Rehearsal summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "✓ Release rehearsal completed (dry run — no tag or GitHub Release created)"
          echo "  Current Atlas line: v${VERSION}"

  sbom:
    name: SBOM snapshot
    if:
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
      github.event.inputs.verify_version == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Do not enable cache: pnpm here. This job never runs `pnpm install`, so the
      # setup-node post-step would fail with:
      # "Path(s) specified in the action for caching do(es) not exist".
      # setup-node@v5 auto-enables package-manager-cache when it detects pnpm;
      # disable it so Post Setup Node.js does not try to save a missing store.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate SPDX SBOM
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: pnpm sbom:generate --output "artifacts/atlas-sbom-${GITHUB_SHA}.spdx.json"

      - name: Validate SBOM JSON
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "artifacts/atlas-sbom-" + process.env.GITHUB_SHA + ".spdx.json";
            const doc = JSON.parse(fs.readFileSync(file, "utf8"));
            if (!doc.spdxVersion || !Array.isArray(doc.packages) || doc.packages.length === 0) {
              throw new Error("SBOM is missing SPDX metadata or package records");
            }
            console.log("✓ SBOM valid (" + doc.packages.length + " packages)");
          '

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-sbom-${{ github.sha }}
          path: artifacts/atlas-sbom-${{ github.sha }}.spdx.json
          retention-days: 90

  version-pr:
    name: Atlas Version PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has-changesets: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update Version PR
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "chore(release): atlas version"
          commit: "chore(release): atlas version"
          version: pnpm changeset:version
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Version PR outcome
        if: always()
        env:
          CHANGESETS_OUTCOME: ${{ steps.changesets.outcome }}
          HAS_CHANGESETS: ${{ steps.changesets.outputs.hasChangesets }}
          VERSION_PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          if [ "${CHANGESETS_OUTCOME}" != "success" ]; then
            echo "::error::Changesets action failed (outcome=${CHANGESETS_OUTCOME}, hasChangesets=${HAS_CHANGESETS}, pullRequestNumber=${VERSION_PR_NUMBER}). Do not treat hasChangesets as Version PR success."
            exit 1
          fi
          if [ -n "${VERSION_PR_NUMBER}" ]; then
            echo "✓ Version PR created or updated (#${VERSION_PR_NUMBER})."
          elif [ "${HAS_CHANGESETS}" = "true" ]; then
            echo "ℹ️ Pending changesets remain; Changesets did not report a Version PR number."
          else
            echo "ℹ️ No pending changesets — no Version PR action required."
          fi

  github-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && needs.version-pr.outputs.has-changesets != 'true'
    needs:
      - sbom
      - version-pr
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      action: ${{ steps.release.outputs.action }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish canonical tag and GitHub Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/publish-atlas-release.mjs --target-sha "${GITHUB_SHA}"

  npm-publish:
    name: Publish npm package
    # The GitHub Release job creates the canonical tag first. This job packs only
    # from that exact tag, so it cannot run earlier. A green GitHub Release is not
    # npm publication. If this job fails, the tag and Release stay, and the version
    # stays out of the consumer upgrade catalog until it exists on npm.
    if:
      github.event_name == 'push' && needs.version-pr.outputs.has-changesets != 'true' &&
      needs.github-release.outputs.action == 'publish'
    needs:
      - github-release
      - version-pr
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install npm CLI for Trusted Publishing
        run: |
          npm install --global npm@11.5.1
          node -e 'const [maj,min,pat]=process.versions.node.split(".").map(Number); if (maj<22 || (maj===22 && min<14)) { throw new Error("Trusted Publishing requires Node >= 22.14.0") }'
          npm --version

      - name: Pack, validate, and publish the exact CLI tarball
        id: npm
        run: node scripts/publish-npm-package.mjs --oidc

      - name: Upload validated npm tarball
        if: steps.npm.outputs.action != 'noop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-npm-${{ steps.npm.outputs.version }}
          path: |
            artifacts/npm/*.tgz
            artifacts/npm/*.publish.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify the published package from npm
        if: success() && steps.npm.outputs.action == 'publish'
        run: |
          pnpm distribution:verify-registry "${{ steps.npm.outputs.version }}" --retries 12 --retry-wait-ms 10000

      - name: First-publish bootstrap required
        if: steps.npm.outputs.action == 'bootstrap-required'
        run: |
          echo "::notice::@blitzcraftlabs/atlas does not exist on npm yet. Download the validated tarball artifact and publish that exact file with a human-authenticated npm publish. Do not rebuild."

  verify-registry:
    name: Verify published npm package
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.verify_version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the published package from npm
        env:
          ATLAS_VERIFY_VERSION: ${{ github.event.inputs.verify_version }}
        run:
          pnpm distribution:verify-registry "${ATLAS_VERIFY_VERSION}" --retries 12 --retry-wait-ms
          10000
